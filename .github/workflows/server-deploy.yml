name: Server Deploy - Main to App Runner

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-deploy.yml'

permissions:
  contents: read

concurrency:
  group: server-deploy-main
  cancel-in-progress: false

jobs:
  test:
    name: Test server 🧪
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brevly_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install dependencies
        id: install-dependencies
        run: npm ci
        working-directory: server

      - name: Run tests
        id: run-tests
        run: npm test
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brevly_test

  build:
    name: Build server 🧱
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install dependencies
        id: install-dependencies
        run: npm ci
        working-directory: server

      - name: Build
        id: build
        run: npm run build
        working-directory: server

  deploy:
    name: Deploy server to App Runner 🚀
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required AWS settings
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          APP_RUNNER_SERVICE_ARN: ${{ vars.APP_RUNNER_SERVICE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          test -n "$AWS_REGION" || (echo "Missing repo variable: AWS_REGION" && exit 1)
          test -n "$AWS_ECR_REPOSITORY" || (echo "Missing repo variable: AWS_ECR_REPOSITORY" && exit 1)
          test -n "$APP_RUNNER_SERVICE_ARN" || (echo "Missing repo variable: APP_RUNNER_SERVICE_ARN" && exit 1)
          test -n "$AWS_ACCESS_KEY_ID" || (echo "Missing secret: AWS_ACCESS_KEY_ID" && exit 1)
          test -n "$AWS_SECRET_ACCESS_KEY" || (echo "Missing secret: AWS_SECRET_ACCESS_KEY" && exit 1)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-and-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          SHORT_SHA="${IMAGE_TAG::7}"
          docker build -t "$IMAGE_URI:$SHORT_SHA" -f server/Dockerfile ./server
          docker push "$IMAGE_URI:$SHORT_SHA"
          echo "image_uri=$IMAGE_URI:$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Trigger App Runner deployment
        env:
          APP_RUNNER_SERVICE_ARN: ${{ vars.APP_RUNNER_SERVICE_ARN }}
        run: |
          OPERATION_ID=$(aws apprunner start-deployment --service-arn "$APP_RUNNER_SERVICE_ARN" --query "OperationId" --output text)
          echo "Deployment started. OperationId: $OPERATION_ID"
